# Local development database.
#
#   npm run db:up      # start PostgreSQL in the background
#   npm run db:migrate # apply Prisma migrations
#   npm run db:down    # stop it again
#
# The credentials below match the DATABASE_URL in .env.example.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: concord
      POSTGRES_PASSWORD: concord
      POSTGRES_DB: concord
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U concord"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
